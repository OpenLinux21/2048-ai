# M3 config: large-scale parallel self-play on the RTX 5060.
# 8192 genomes x 4 CRN episodes = 32768 simultaneous games per generation.
population: 8192
episodes_per_genome: 4
generations: 300
max_episode_steps: 20000
device: cuda
seed: 0
features: [value16, empty, corner_max, max_exp, monotonic4, smoothness]
fitness:
  mode: score_maxtile
  maxtile_tier_bonus: 200   # +1 tier per tile level above 1024 (2048 -> +200)
ga:
  elite_count: 32
  tournament_k: 8
  crossover: uniform
  crossover_rate: 0.9
  mutation_rate: 0.15
  mutation_sigma: 0.25
  init_range: 1.0
out_dir: runs/gpu
checkpoint_every: 25
log_every: 5
