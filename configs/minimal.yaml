# M1 minimal config: small CPU population, sanity-scale GA.
population: 50
episodes_per_genome: 4
generations: 200
max_episode_steps: 20000
device: cpu
seed: 0
features: [value16, empty]
fitness:
  mode: score
ga:
  elite_count: 2
  tournament_k: 4
  crossover: uniform
  crossover_rate: 0.9
  mutation_rate: 0.1
  mutation_sigma: 0.25
  init_range: 1.0
out_dir: runs/minimal
checkpoint_every: 10
log_every: 1
